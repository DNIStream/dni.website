name: Static site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEED_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:build
      - run: npx playwright install --with-deps chromium
      # Pull requests and pushes run the critical tests first, then the rest of the default tier;
      # the scheduled and manual runs add the extended tier.
      - name: E2E, critical
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm run test:e2e -- --grep @critical
      - name: E2E, default tier
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm run test:e2e -- --grep-invert "@critical|@extended"
      - name: E2E, everything
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
