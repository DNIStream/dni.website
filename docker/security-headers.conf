# Included in every location: nginx drops server-level add_header lines in any location that
# sets its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# The sha256 source is the one inline script, in site/_includes/partials/head.njk.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qOhFsq0QMV2REqNwk5hGH5bZE9SkX6gt6yeyKdYPv+U=' https://web3forms.com https://*.hcaptcha.com https://hcaptcha.com; frame-src https://*.hcaptcha.com https://hcaptcha.com; style-src 'self' 'unsafe-inline' https://*.hcaptcha.com https://hcaptcha.com; img-src 'self' https: data:; media-src https:; connect-src 'self' https://api.web3forms.com https://*.hcaptcha.com https://hcaptcha.com; font-src 'self'; form-action https://api.web3forms.com; base-uri 'self'; frame-ancestors 'none'" always;
