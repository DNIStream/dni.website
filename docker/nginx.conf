worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;

  # The root filesystem is read-only: every temporary path lives on the /tmp tmpfs.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  client_max_body_size 1k;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml
    application/rss+xml application/manifest+json image/svg+xml;

  server {
    listen 8080 default_server;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    error_page 404 /404.html;

    location = /healthz {
      default_type text/plain;
      add_header Cache-Control "no-store" always;
      include /etc/nginx/security-headers.conf;
      access_log off;
      return 200 "ok\n";
    }

    location = /404.html {
      internal;
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/security-headers.conf;
    }

    # CSS and JS are referenced with a content-hash query; fonts carry their version in the name.
    location ~* \.(?:css|js|woff2)$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpe?g|webp|avif|ico|webmanifest)$ {
      add_header Cache-Control "public, max-age=86400" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/index.html $uri.html =404;
    }
  }
}
